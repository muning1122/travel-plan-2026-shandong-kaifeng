name: Deploy static travel planner

on:
  workflow_dispatch:
  schedule:
    # 北京时间每天 02:17、08:17、14:17、20:17 刷新官方天气快照。
    - cron: "17 0,6,12,18 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh all route weather snapshots
        run: node tools/update-weather-snapshot.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
